# Federated Learning Configuration

fl:
  training_rounds: 45             # Phase 1: honest training rounds
  simulation_rounds: 2000000         # Phase 2: adversarial RL rounds
  n_clients: 20                   # total federated clients (honest majority)
  n_compromisable: 5              # the attacker can ONLY access clients [0 .. n_compromisable-1];
                                  # the remaining clients are always honest & out of reach.
  poison_fraction: 0.2            # DEPRECATED for selection: the attacker now CHOOSES which of
                                  # its pool to poison (see attack.max_poison_clients). Kept only
                                  # as a legacy fallback for defenses that assume a #malicious.
  poison_seed: 0                  # RNG seed: non-IID partition + per-round budget sampling + repro
  benign_retrain_each_round: false # false = benign clients replay frozen Phase-1 final-round local weights every round
  local_epochs: 3
  batch_size: 64
  lr: 0.002
  device: "cuda"                  # RL training needs a GPU; use "cpu" only for --dry-run/--baseline

data:
  dataset: "mnist"                # DEFAULT dataset; override per run with
                                  #   python main.py --env linux --dataset cifar10
                                  # See the `datasets:` block below for per-dataset
                                  # hyperparameters, and data/datasets.py for the registry.
  iid: false
  noniid_bias: 0.5                # FLTrust bias probability q (iid=false only). 1/n_classes=0.1
                                  # is IID; larger = more non-IID; paper default 0.5.
  data_dir: null                  # null = the selected dataset's own directory
                                  # (./data/mnist_raw, ./data/cifar10_raw). Setting one
                                  # dataset's path here while running the other is
                                  # rejected — two datasets must not share a cache.
  # n_classes: 10                 # non-IID GROUP count (iid=false only); defaults to
                                  # the dataset's own class count. Both shipped
                                  # datasets have 10, so this is normally left unset.

# --- Per-dataset overrides -------------------------------------------------
# Deep-merged over the shared blocks above once --dataset is resolved, and the
# per-dataset value WINS. Only fl / data / attack / defense / rl may be overridden;
# anything else is a typo and raises rather than being silently ignored.
#
# What is per-dataset and what is not:
#   PER DATASET  the FL model architecture (model/__init__.py:build_model), the raw
#                data dir, the Phase-1 checkpoint + live FL state + round counters
#                (checkpoints/<dataset>/), and the logs (logs/<dataset>/).
#   SHARED       the LLM. checkpoints/attacker_adapter is NOT dataset-scoped, so
#                every run — mnist or cifar10 — continues fine-tuning the same
#                LoRA from its last checkpoint. That is the point of the switch.
datasets:
  mnist:
    fl:
      training_rounds: 45         # ~970-param MLP converges fast
      lr: 0.002
      local_epochs: 3
  cifar10:
    fl:
      training_rounds: 80         # 33.8k-param CNN on a harder task needs more rounds
      lr: 0.01                    # plain SGD (no momentum) on a conv net: 0.002 barely moves
      local_epochs: 3
    # A CIFAR-10 clean baseline lands well below MNIST's, so an absolute
    # `target_accuracy_drop` is a much larger share of the headroom there: 0.10 off
    # a ~0.66 baseline is ~15% of the model's accuracy, against ~10% on MNIST. The
    # shared goal of 0.10 is a reasonable ask on both; revisit it against the
    # baseline your Phase 1 actually reaches.
    #
    # `target_choices` is only read when attack.sample_target_in_training is true —
    # inert under the current fixed-target setting, kept so re-enabling sampling
    # still gets a CIFAR-appropriate pool rather than the shared one (whose 0.30 is
    # nearly half this dataset's headroom).
    attack:
      target_choices: [0.05, 0.10, 0.15, 0.20]
    rl:
      max_seq_len: 16384          # The attacker prompt carries delta_details for EVERY
                                  # client in the pool, and Cifar10Net has 8 parameter
                                  # tensors to MnistNet's 4 — so the same pool costs
                                  # roughly twice the tokens. Training (pool = 5) needs
                                  # only ~3.2k, but the benchmark can widen the pool to
                                  # all 20 clients (--max-poison-clients 20), which lands
                                  # near/over the 8192 default BEFORE max_new_tokens.
                                  # Past the limit generations are truncated and the
                                  # attack JSON stops parsing, which reads as a
                                  # mysteriously weak attacker rather than as a context
                                  # error. Qwen2.5's native context is 32k, and raising
                                  # the cap costs nothing on the short training prompts.
                                  # benchmark.harness._check_prompt_fits logs the real
                                  # token count on round 1 either way.

# --- Training curriculum: the (defense algorithm x poisoner count) sweep --------
# What the attacker faces each GRPO round used to be TWO independent coin flips:
# `defense.selection: random` drew the algorithm and `attack.sample_budget_in_training`
# drew the poison quota in [1, max_poison_clients]. With 4 algorithms x 5 quotas that
# is 20 distinct regimes visited in random order, so the policy almost never got two
# consecutive rounds in the same one, and specific PAIRS ("FLTrust with 5 poisoners")
# could go hundreds of rounds unseen while others repeated back to back. Both knobs
# also move the reward SCALE, so shuffling them per round injected variance straight
# into the signal GRPO normalizes within a group.
#
# The curriculum replaces both draws with one fixed, repeating sweep:
#
#   fltrust    1 poisoner x10 rounds, 2 x10, 3 x10, 4 x10, 5 x10   (50 rounds)
#   defl       1 poisoner x10 rounds, 2 x10, 3 x10, 4 x10, 5 x10   (50 rounds)
#   dnc        ... the same five blocks ...                        (50 rounds)
#   multikrum  ... the same five blocks ...                        (50 rounds)
#   -> wrap back to (fltrust, 1 poisoner) and repeat forever
#
# so every pair gets exactly `rounds_per_block` CONSECUTIVE rounds per 200-round
# cycle — equal opportunity by construction rather than in expectation. The cursor is
# checkpointed with the rest of the resume state, so a restart continues mid-block.
# See rl/curriculum.py.
curriculum:
  enabled: true                   # false = the legacy independent random draws
  rounds_per_block: 10            # consecutive GRPO rounds per (defense, poisoner-count) pair
  poisoner_counts: [1, 2, 3, 4, 5] # swept INSIDE each algorithm, in this order. Every entry
                                  # must be <= fl.n_compromisable (5) or the build fails
                                  # loudly. null = 1..attack.max_poison_clients.
  algorithms: null                # null = defense.algorithms, in the order listed there
                                  # (fltrust -> defl -> dnc -> multikrum). Give an explicit
                                  # subset/order to change which algorithms are swept; every
                                  # name must also appear in defense.algorithms.
                                  #
                                  # NOT affected by the sweep: defense.assumed_byzantine stays
                                  # a fixed server-side ASSUMPTION (DnC/Multi-Krum must never
                                  # be told the round's true poisoner count), and the attack
                                  # goal stays pinned at attack.goal.target_accuracy_drop —
                                  # the curriculum varies who and how many, never how hard.

# Attack goal (configurable). First experiment = untargeted accuracy reduction.
attack:
  goal:
    type: "untargeted_degrade"    # untargeted_degrade | slow_degrade | targeted_label
    target_accuracy_drop: 0.10    # THE training + eval target — ONE fixed value for the whole
                                  # run. With sample_target_in_training false (below) every
                                  # round asks for exactly this drop, and a curriculum forces
                                  # that even if the flag is flipped on.
    # per_round_drop: 0.02        # slow_degrade
    # label: 7                    # targeted_label (per-class eval is a TODO; falls back to overall)
  # --- Attack-goal target sampling (generalize instead of overfitting a single target) ---
  sample_target_in_training: false # false = every round uses goal.target_accuracy_drop (0.10).
                                  # true = randomize it each round from `target_choices`, making the
                                  # policy TARGET-AWARE so it generalizes to any requested drop
                                  # (mirrors sample_budget_in_training). Eval always fixes it.
                                  # IGNORED (forced false, with a warning) while the curriculum
                                  # above is enabled: a target that moves per round rescales the
                                  # damage term, which is exactly the confound the sweep removes.
                                  #
                                  # Fixed is the right default while the attacker cannot reliably
                                  # reach ONE target: sampling spends capacity on target-awareness
                                  # the policy has no use for yet, and it also makes the drop term
                                  # (which normalizes by the round's target) mean a different thing
                                  # each round, so the reward scale moves between rounds for reasons
                                  # the policy cannot control. Turn it back on once a fixed target
                                  # is being hit — that is when generalizing across targets starts
                                  # to buy something.
  target_choices: [0.05, 0.10, 0.20, 0.30]  # per-round target pool — INERT unless
                                  # sample_target_in_training is true
  # --- Exact client-selection quota (the attacker chooses WHICH clients) ---
  max_poison_clients: 5           # TRAINING quota cap (legacy key name; must be <=
                                  # n_compromisable). With the curriculum on, this is only the
                                  # default upper end of curriculum.poisoner_counts and the
                                  # basis for defense.assumed_byzantine; the per-round quota
                                  # comes from the sweep. With it off, the quota is sampled in
                                  # [1, 5] each round.
  sample_budget_in_training: true # randomly draw the exact per-round quota in
                                  # [1..max_poison_clients] for budget-aware generalization.
                                  # IGNORED while the curriculum is enabled — the sweep visits
                                  # 1..5 in fixed blocks instead of drawing i.i.d.
  eval_poison_clients: 5          # EVALUATION exact quota — matches max_poison_clients so the
                                  # benchmark uses all 5 poisoners (benchmark --max-poison-clients override)

# Server-side defense — what the attacker actually faces every Phase-2 round.
defense:
  mode: "algorithmic"             # algorithmic | llm
                                  # algorithmic = the DEFENDER LLM IS DISABLED. The server
                                  #   defends with the published algorithms below instead;
                                  #   only the attacker trains (rl/schedule.py runs
                                  #   attacker-only phases and never touches the defender
                                  #   adapter on disk, so `llm` can be restored later).
                                  # llm = the original two-sided arms race (trainable
                                  #   defender LLM + FedAvg over the un-flagged clients).
  algorithms: ["fltrust", "defl", "dnc", "multikrum"]
                                  # the rotation pool. ONE is used per round and defends
                                  # the whole round (clean counterfactual, all G scored
                                  # rollouts, and the commit), so the group's rewards stay
                                  # comparable. Each algorithm also produces the round's
                                  # AGGREGATE — FLTrust's trust-weighted rescaling, DeFL's
                                  # Beta weighting, DnC/Multi-Krum's filtered mean — rather
                                  # than only a drop-list. 'oracle' (reads ground truth) and
                                  # 'llm_defender' are not selectable here.
  selection: "random"             # random = draw one algorithm per round (uniform).
                                  # round_robin = cycle them in listed order (controlled
                                  # comparisons / even coverage).
                                  # IGNORED while `curriculum.enabled` is true — the sweep
                                  # pins the algorithm for a whole block of rounds instead.
  seed: null                      # RNG seed for the algorithm draw; null = fl.poison_seed.
                                  # A dedicated stream, so it never shifts the env's
                                  # poison/budget/target sampling.
  assumed_byzantine: null         # DnC / Multi-Krum assumed #malicious (a hyperparameter,
                                  # never per-round truth). null = attack.max_poison_clients
                                  # clamped to keep an honest majority. Deliberately CONSTANT
                                  # across the curriculum's 1..5-poisoner blocks: a defense
                                  # handed the round's real count would not be a defense.
  fltrust:
    root_size: 100                # clean server-side root examples (FLTrust bootstrap)
    root_epochs: null             # server local epochs R_l on the root set.
                                  # null = size it so the root update takes the SAME
                                  # number of SGD ITERATIONS as an honest client
                                  # (fl.local_epochs x batches_per_client). This is
                                  # load-bearing: FLTrust rescales EVERY accepted delta
                                  # to ||g0|| (Eq. 3), so the SERVER's reference update
                                  # sets how far the global can move each round. The
                                  # old root_epochs: 1 gave ~2 iterations (100 examples
                                  # / batch 64) against a client's ~120, i.e. ||g0||
                                  # ~60x too small — the global froze, so the clean
                                  # counterfactual and every poisoned rollout scored
                                  # the same accuracy, the damage term was ~0 for all G
                                  # candidates, and ~1/4 of all rounds (FLTrust's share
                                  # of the rotation) produced no gradient at all. The
                                  # configured target drops were unreachable in
                                  # principle. Set an integer to pin R_l explicitly.
    root_lr: null                 # null = fl.lr
    eta: 1.0                      # FLTrust global learning rate
  defl:
    delta: 0.05                   # CLP relative-rise threshold (paper Eq. 4)
    tau: 2.5                      # MOUD per-layer outlier z-threshold
  dnc:
    c: 1.0                        # filtering fraction
    niters: 1                     # subsampling iterations
    sub_dim: 10000                # subsample dim b (clamped to the model's 970 dims)
    seed: null                    # null = defense.seed / fl.poison_seed
  multikrum:
    m: null                       # #selected/averaged; null = n - assumed_byzantine

# Inference-only LLM defaults (used by --dry-run and the OpenAI path).
llm:
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:3b"

# Reinforcement learning (GRPO) settings — see README "LLM handling".
rl:
  model: "unsloth/Qwen2.5-3B-Instruct"  # HF/Unsloth base for QLoRA training
  attn_implementation: "eager"    # broadly compatible; Qwen2.5 also supports "sdpa"
  use_fast_generate: true         # KV-cached generation (fast); auto-falls back to no-cache on failure
  max_seq_len: 8192               # well within Qwen2.5-3B's 32k native context
  load_in_4bit: false             # bf16 LoRA: 3B needs ~12GB+ VRAM; set true (4-bit QLoRA) if tight
  lora_r: 16
  lora_alpha: 32
  G: 4                            # rollouts per GRPO step (group size)
  kl_beta: 0.02                   # KL penalty toward the frozen base model
  lr: 1.0e-5
  temperature: 1.0                # learner sampling temperature (exploration)
  opponent_temperature: 0.0       # frozen opponent plays greedily when a round is COMMITTED
  scoring_opponent_temperature: 0.7 # frozen opponent temp while SCORING the G rollouts;
                                  # >0 so candidates see varied opponent verdicts -> restores
                                  # within-group reward spread (fixes attacker zero-advantage)
                                  # NOTE: both opponent temperatures apply only to the defender
                                  # LLM (defense.mode: llm). An algorithm is deterministic given
                                  # the updates, so under defense.mode: algorithmic the
                                  # within-group spread comes from the attack plans themselves.
  # first_learner / K_a / K_d below are attacker-only under defense.mode: algorithmic
  # (there is no defender policy to train — see the `defense:` block).
  max_new_tokens: 1024            # headroom for the defender's 20-client verdict list and the
                                  # attacker's per-client plans (raise if outputs get truncated)
  grad_clip: 1.0
  save_every: 25                  # checkpoint adapters + progress every N rounds (resume granularity)
  league_snapshot_every: 100      # snapshot adapters into the opponent league
  league_prob: 0.25               # chance a training phase faces a league snapshot
  league_max_snapshots: 10        # HARD CAP on retained snapshots per adapter (ring buffer —
                                  # oldest evicted). Each snapshot is a full copy of one adapter's
                                  # LoRA tensors: ~115 MB for Qwen2.5-3B at lora_r=16, so the
                                  # league costs about league_max_snapshots x 2 x 115 MB of host
                                  # RAM (~2.3 GB at 10). Unbounded, it OOMs a long run.

  # --- Zero-advantage guard (stops the attacker un-learning toward base) ---
  resample_on_zero_advantage: true # if a group has no reward spread, re-roll once at higher temp
  resample_temperature: 1.3       # temperature for that re-roll
  skip_zero_advantage: true       # if still degenerate, skip the step (apply NO gradient)
  min_reward_spread: 0.02         # NOISE FLOOR: a group whose rewards span less than this is
                                  # DEGENERATE (resample, then skip). Accuracy is measured on 10k
                                  # test examples -> quantized to 1e-4, which at the smallest
                                  # sampled target (0.05) is ~2e-3 of reward per single flipped
                                  # example. The old test was std < 1e-6, so identical rollouts
                                  # that differed by measurement noise were z-scored up to
                                  # A = +-1.2 and trained on. A real 1% accuracy gap scores 0.2
                                  # at that target, so this bar is easy for genuine differences.
  commit_selection: "sample"      # which of the G scored rollouts ADVANCES the environment.
                                  # sample = a uniform draw from the group (on-policy).
                                  # argmax = the best-scoring one (legacy). argmax made the
                                  # committed round a best-of-G result, so every logged
                                  # `learner_success` and every phase switch measured
                                  # max-of-G rather than the policy — numbers that do not
                                  # reproduce at eval, where the benchmark samples once. It
                                  # also fed the learner an optimistic state trajectory it
                                  # never has to survive. The argmax is still logged as
                                  # `best_index` next to `committed_index`.
  advantage_std_floor: 0.05       # floor on the z-score denominator, in reward units. Plain
                                  # z-scoring is scale-free (spread 0.02 and spread 1.0 both give
                                  # A = +-1.2), so the update size carried no information about how
                                  # much better the winning rollout was. Above this std it reduces
                                  # to standard GRPO. Set both to 0 for textbook GRPO.

  # --- Schedule: success-gated iterated best response (the arms-race ratchet) ---
  switch_mode: "best_response"    # best_response | fixed (legacy K_a/K_d alternation)
  first_learner: "attacker"       # who trains first
  min_phase_rounds: 3             # earliest a phase may switch on a sustained win. Set equal to
                                  # success_streak so a phase switches as soon as the learner wins
                                  # success_streak times IN A ROW (no extra minimum-length gate).
                                  # Raise it above success_streak to require a longer phase.
  max_phase_rounds: 4000           # hard cap: switch even without a win (prevents a stuck phase)
  success_streak: 3               # consecutive winning rounds needed to freeze + switch
  fl_interlude_between_phases: true # before every phase AFTER the first, run ONE honest FL round
                                  # (like Phase 1): all benign clients retrain from the current
                                  # global, FedAvg into a new global, and the refreshed per-client
                                  # weights become what the next learner / frozen opponent /
                                  # aggregator consume. false = keep the frozen Phase-1 weights.
  curriculum_on_cap: true         # after a phase caps without a win, next learner faces an
                                  # earlier opponent snapshot so it can find a foothold
  attacker_min_drop: 0.02         # FALLBACK absolute drop bar, used only when the round's goal
                                  # is unknown; normally the relative win_fraction gate applies.
  win_fraction: 0.6               # "attack passed" = committed drop >= win_fraction * the round's
                                  # requested target_accuracy_drop (so the success gate tracks the
                                  # per-round sampled target instead of one absolute floor).
  attacker_min_evaded: 1.0        # fraction of poisoned clients that must evade detection
  defender_min_tpr: 0.99          # defender "win": catches the poisoned client(s)...
  defender_max_fpr: 0.10          # ...without over-flagging honest clients
  # Legacy fixed-mode knobs (used only when switch_mode: fixed):
  K_a: 4                          # attacker rounds per alternation
  K_d: 4                          # defender rounds per alternation
  adapter_paths:
    attacker: "checkpoints/attacker_adapter"
    defender: "checkpoints/defender_adapter"
  reward:
    attacker:
      alpha: 1.0                  # weight on accuracy-drop term
      beta: 0.5                   # weight on evasion term
      gamma: 1.0                  # penalty for malformed weight output
      zeta: 0.2                   # bonus for COLLABORATIVE multi-client attacks: diversity =
                                  # 1 - mean pairwise cosine of chosen clients' perturbations
                                  # (0 for a single client). Rewards distinct, coordinated roles.
      stealth_floor: 1.0          # HOW BIG an edit has to be before evading detection pays.
                                  # Per client, stealth is scaled by min(1, r / stealth_floor)
                                  # where r = ||poisoned - benign|| / ||benign - global||, i.e.
                                  # the edit measured against the honest update it replaces.
                                  # Ungated, `beta * stealth` is a guaranteed 0.5 for submitting
                                  # a rounding error: undetectable by construction, and better
                                  # than attacking, because a robust aggregator rescales
                                  # magnitudes and drops outliers so the damage term is hard to
                                  # move. Policies converge to exactly that -- perturbations
                                  # below the honest client-to-client spread, which Multi-Krum /
                                  # DnC then rank as MORE central than a real client (they
                                  # survive every filter and cost the model nothing), after
                                  # which the zero-advantage guard freezes them there. 1.0 =
                                  # full credit needs an edit at least as large as the honest
                                  # update. Set 0 to disable the gate (pre-fix behaviour).
    defender:
      mode: "soft_f1"             # soft_f1 | tpr_minus_fpr
      fpr_penalty: 1.0
