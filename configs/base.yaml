# Federated Learning Configuration

fl:
  training_rounds: 45             # Phase 1: honest training rounds
  simulation_rounds: 2000000         # Phase 2: defender-learning rounds
  n_clients: 20                   # total federated clients (honest majority)
                                  # WHICH of them flip labels is attack.poison_client_ids.
  poison_fraction: 0.2            # legacy fallback for defenses that need an assumed
                                  # #malicious when none is configured (see
                                  # defense.assumed_byzantine).
  poison_seed: 0                  # RNG seed: non-IID partition, per-round data slices, WHICH
                                  # examples each poisoned client flips, and general repro
  # --- Phase 2 = SIMULATED rounds on the frozen Phase-1 model ---
  freeze_global_in_phase2: true   # true = Phase 2 does NOT continue the federation. Every
                                  # defender-learning round is an independent episode off the
                                  # SAME Phase-1 final model: the anchor is sent to the clients,
                                  # they train on new local data, the insiders re-train it with
                                  # flipped labels, the server defends and aggregates, the
                                  # aggregate is SCORED on the test set and then DISCARDED — the
                                  # next round starts from the anchor again.
                                  #
                                  # Why not let it accumulate: in a continuing federation the
                                  # attack's own damage becomes the next round's starting point,
                                  # so a round's numbers depend on the wreckage left by every
                                  # round before it, and a run that has already collapsed the
                                  # model measures every subsequent round against rubble. The
                                  # damage term (clean_reference_accuracy - post_accuracy) is
                                  # only a controlled comparison when both branches start from
                                  # the same model, which is what the frozen anchor guarantees.
                                  #
                                  # false = a continuing federation (each committed aggregate
                                  # becomes the next round's global). Note that
                                  # rl.fl_interlude_between_phases only does anything when this
                                  # is false — with a frozen anchor there is no shared FL state
                                  # to advance, so the interlude is skipped.
  client_data_refresh: "rotate"   # step 2 of a simulated round: what data the clients train on.
                                  # rotate   = the client's shard is shuffled and cut into disjoint
                                  #            per-round slices; round r trains on slice r, and the
                                  #            shard is re-shuffled (re-cut differently) once it is
                                  #            exhausted. Every example is used before any is reused.
                                  # resample = an independent random draw from the shard each round.
                                  # none     = every round replays the whole fixed shard, so rounds
                                  #            differ only by SGD shuffle order. Combined with the
                                  #            frozen anchor that makes consecutive rounds nearly
                                  #            identical, which is why it is not the default.
                                  # A slice always comes from the client's OWN shard, so the non-IID
                                  # skew the FLTrust partition built is preserved.
  client_round_fraction: 0.25     # fraction of its shard a client trains on per round.
                                  # 20 clients over MNIST = ~3000-example shards, so 0.25 is ~750
                                  # examples (12 batches, 36 SGD iterations at local_epochs: 3) and
                                  # `rotate` covers the whole shard every 4 rounds.
                                  # It is a REAL knob on the FL dynamics, not just bookkeeping:
                                  # fewer examples per round = fewer SGD iterations = smaller honest
                                  # updates, so a poisoned update of a given size stands out more.
                                  # Raising it toward 1.0 restores full-shard local training at the
                                  # cost of `rotate` degenerating to a per-round re-shuffle of the
                                  # same examples (i.e. no new data).
                                  # It also sets FLTrust's root fine-tuning budget: root_epochs is
                                  # iteration-matched to local_epochs x batches-per-round (see
                                  # defense.fltrust.root_epochs), and main.py counts those batches
                                  # over the ROUND's data, not the full shard. Lowering this
                                  # therefore shrinks ||g0|| in step with the honest clients — do
                                  # not "fix" one without the other.
  benign_retrain_each_round: true  # FORCED ON, and kept only so an old config still parses.
                                  # A label-flipping client's poison IS its local training on
                                  # mislabelled data — there is no frozen state_dict to replay
                                  # and no weight edit to apply — so the round cannot happen
                                  # without training. Replaying frozen honest weights while the
                                  # poisoned clients trained fresh would also be a giveaway for
                                  # entirely the wrong reason (staleness, not the flipped
                                  # labels). Setting this false logs a warning and is ignored.
                                  # Cost is one local-training pass per client per round, which
                                  # on this 970-parameter model is negligible.
  local_epochs: 3
  batch_size: 64
  lr: 0.002
  device: "cuda"                  # RL training needs a GPU; use "cpu" only for --dry-run/--baseline

data:
  dataset: "mnist"
  iid: false
  noniid_bias: 0.5                # FLTrust bias probability q (iid=false only). 1/n_classes=0.1
                                  # is IID; larger = more non-IID; paper default 0.5.
  data_dir: "./data/mnist_raw"

# ---------------------------------------------------------------------------
# THE ATTACK — label flipping, on a detection-adaptive ladder.
#
# This is the ONLY attack the system implements. A fixed set of insider clients
# trains each round on its own data with a share of the labels flipped
# symmetrically (y -> 9-y), and how large that share is follows a ladder that
# reacts to the defense:
#
#   start at 100% of the client's per-round data
#   caught            -> step down one step_fraction  (100% -> 90% -> 80% -> ...)
#   NOT caught        -> hold this level and send it again
#   caught at the floor -> reset to 100% and descend again
#
# On a client holding 1000 examples per round that is exactly 1000, 900, 800, ...
# down to 500, then back to 1000. The descent rate is set by the DEFENDER's own
# competence, so the curriculum it faces is generated by its own failures.
#
# Why the poison is in the DATA and not in the weights: a weight-space edit is a
# post-hoc transform whose magnitude is a free parameter, so an attacker can dial
# it to whatever a detector tolerates and the resulting update need not resemble
# anything a real client would send. A label flip has exactly one knob — how many
# of the client's own examples are mislabelled — and the update it produces is a
# genuine SGD trajectory, so it sits inside the honest update distribution by
# construction. See data/label_flip.py and agents/label_flip_attacker.py.
# ---------------------------------------------------------------------------
attack:
  type: "label_flip"              # the only implemented attack; validated, not dispatched on
  poison_client_ids: [0]          # WHICH clients flip labels, every round. Default: just
                                  # client 0, the single insider. Add ids for a larger
                                  # foothold, e.g. [0, 1, 2]. Ids outside 0..n_clients-1
                                  # are dropped with a warning rather than clamped.
                                  # NOTE once this reaches half of fl.n_clients the
                                  # federation has no honest majority and the robust
                                  # aggregators are outside the regime they are proved in
                                  # (logged at startup).
  n_classes: 10                   # MNIST label count; sets the symmetric flip y -> 9-y
  schedule:
    start_fraction: 1.0           # the TOP of the ladder: flip every label the client
                                  # trains on this round. Where each cycle begins.
    step_fraction: 0.1            # how far one detection backs the attack off. 0.1 of a
                                  # 1000-example round is the 1000 -> 900 -> 800 walk.
    floor_fraction: 0.5           # the BOTTOM. Below about half the client's data the
                                  # honest gradient dominates its own update, so neither
                                  # "caught" nor "missed" carries information any more —
                                  # the round stops being an attack and starts being
                                  # noise. Caught AT the floor resets to start_fraction
                                  # instead of descending further, so the run keeps
                                  # re-testing the whole range rather than parking at the
                                  # weakest setting for the rest of training.
                                  # Snapped onto the step grid; an unreachable value is
                                  # moved to the nearest reachable level, with a log line.
    caught_rule: "all"            # with several poisoned clients, how many must be flagged
                                  # for the round to count as CAUGHT (and step down):
                                  #   all      = every poisoned client (default) — one
                                  #              surviving insider is a successful round
                                  #   majority = more than half of them
                                  #   any      = at least one; the harshest, fastest descent
  # --- The DAMAGE BAR (reporting only) ---
  # None of this changes what the attack does — the ladder decides that. It sets the
  # scale the round's measured accuracy drop is REPORTED against, so `attack_effectiveness`
  # in the round logs means "1.0 = cost the model target_accuracy_drop".
  goal:
    type: "untargeted_degrade"    # untargeted_degrade | slow_degrade | targeted_label
    target_accuracy_drop: 0.10    # a round that costs 10 accuracy points scores 1.0
    # per_round_drop: 0.02        # slow_degrade
    # label: 7                    # targeted_label (per-class eval is a TODO; falls back
                                  # to overall accuracy)
  sample_target_in_training: false # true = redraw the reporting target each round from
                                  # target_choices. Off: a target that moves round to round
                                  # makes `attack_effectiveness` incomparable between rounds
                                  # for no gain, since nothing trains on it.
  target_choices: [0.05, 0.10, 0.15, 0.20]  # only read when sample_target_in_training is true

# Server-side defense — what the label-flip attack faces every Phase-2 round.
defense:
  mode: "llm"                     # llm | algorithmic
                                  # llm = the TRAINABLE DEFENDER LLM (the only learner in
                                  #   the system). It classifies every client from weight-
                                  #   delta statistics, FedAvg averages the un-flagged, and
                                  #   GRPO updates it on the soft-F1 of its verdicts against
                                  #   ground truth. Its verdicts also drive the attack's
                                  #   ladder, so the two co-adapt.
                                  # algorithmic = the published algorithms below defend
                                  #   instead. The attack is a fixed schedule, so this
                                  #   leaves NOTHING to train: `python main.py` refuses,
                                  #   and it is meant for --dry-run / --baseline / the
                                  #   benchmark, where it measures those algorithms against
                                  #   the same label-flip ladder.
  algorithms: ["fltrust", "defl", "dnc", "multikrum"]
                                  # the rotation pool. ONE is used per round and defends
                                  # the whole round (clean counterfactual, all G scored
                                  # rollouts, and the commit), so the group's rewards stay
                                  # comparable. Each algorithm also produces the round's
                                  # AGGREGATE — FLTrust's trust-weighted rescaling, DeFL's
                                  # Beta weighting, DnC/Multi-Krum's filtered mean — rather
                                  # than only a drop-list. 'oracle' (reads ground truth) and
                                  # 'llm_defender' are not selectable here.
  selection: "random"             # random = draw one algorithm per round (uniform).
                                  # round_robin = cycle them in listed order (controlled
                                  # comparisons / even coverage).
                                  # IGNORED while the `curriculum:` block below is enabled —
                                  # the round's algorithm is then the current block's.
  seed: null                      # RNG seed for the algorithm draw; null = fl.poison_seed.
                                  # A dedicated stream, so it never shifts the env's
                                  # poison/budget/target sampling.
  assumed_byzantine: null         # DnC / Multi-Krum assumed #malicious (a hyperparameter,
                                  # never per-round truth). null = len(attack.poison_client_ids)
                                  # clamped to keep an honest majority.
  fltrust:
    root_size: 100                # clean server-side root examples (FLTrust bootstrap)
    root_epochs: null             # server local epochs R_l on the root set.
                                  # null = size it so the root update takes the SAME
                                  # number of SGD ITERATIONS as an honest client
                                  # (fl.local_epochs x batches_per_client). This is
                                  # load-bearing: FLTrust rescales EVERY accepted delta
                                  # to ||g0|| (Eq. 3), so the SERVER's reference update
                                  # sets how far the global can move each round. The
                                  # old root_epochs: 1 gave ~2 iterations (100 examples
                                  # / batch 64) against a client's ~120, i.e. ||g0||
                                  # ~60x too small — the global froze, so the clean
                                  # counterfactual and every poisoned rollout scored
                                  # the same accuracy, the damage term was ~0 for all G
                                  # candidates, and ~1/4 of all rounds (FLTrust's share
                                  # of the rotation) produced no gradient at all. The
                                  # configured target drops were unreachable in
                                  # principle. Set an integer to pin R_l explicitly
                                  # (an explicit value is never capped).
    max_root_epochs: 10           # CEILING on the iteration-matched count above. Matching
                                  # iterations un-capped asks for ~70 epochs over 100 root
                                  # examples, which the model memorises: g0 stops being a
                                  # descent direction the clients share and becomes a
                                  # root-set-overfit direction of its own. Trust is
                                  # ReLU(cos(delta_i, g0)), so honest clients then score
                                  # cos <= 0 and get DROPPED — measured FPR 0.9-1.0 for
                                  # whole blocks, and rounds where the ONLY clients FLTrust
                                  # accepted were the poisoned ones (the aggregate was then
                                  # built entirely from the attack, so the "drop" measured
                                  # the defense malfunctioning, not the attacker). The cap
                                  # keeps ||g0|| ~10x the root_epochs: 1 value without
                                  # letting the reference overfit. If the aggregate still
                                  # moves too slowly, raise `eta` — that is the paper's own
                                  # knob for the step size — rather than this.
    root_lr: null                 # null = fl.lr
    eta: 1.0                      # FLTrust global learning rate (paper Eq. 5). This, not
                                  # max_root_epochs, is the right knob for "the global model
                                  # should move further per round".
  defl:
    delta: 0.05                   # CLP relative-rise threshold (paper Eq. 4)
    tau: 2.5                      # MOUD per-layer outlier z-threshold
  dnc:
    c: 1.0                        # filtering fraction
    niters: 1                     # subsampling iterations
    sub_dim: 10000                # subsample dim b (clamped to the model's 970 dims)
    seed: null                    # null = defense.seed / fl.poison_seed
  multikrum:
    m: null                       # #selected/averaged; null = n - assumed_byzantine

# Training curriculum — the ORDER Phase-2 rounds face each (defense, #poisoners) pair.
#
# Replaces the two per-round random draws (defense.selection + attack.
# sample_budget_in_training) with a deterministic sweep:
#
#   fltrust   x 1 poisoner  x 10 rounds -> x 2 x 10 -> x 3 x 10 -> x 4 x 10 -> x 5 x 10
#   defl      x 1 poisoner  x 10 rounds -> ... (same five blocks)
#   dnc       x ...
#   multikrum x ...
#   ...then the cycle repeats from fltrust.
#
# One cycle is 4 algorithms x 5 counts x 10 rounds = 200 rounds, and EVERY algorithm
# gets exactly 50 of them, 10 at each attack strength. Two independent uniform draws
# gave that split only in expectation: per-cell counts are Binomial(200, 1/20), mean
# 10 with sd ~3.1, so cells routinely differed 2-3x and the attacker's gradient budget
# went wherever the RNG pointed. The draws also re-rolled every round, so the policy
# never got a contiguous stretch against one defense at one attack strength — the
# regime it actually has to exploit. Stateful defenses benefit too: DeFL's Beta
# reputation counts and DnC's subsampling RNG now advance over 10 consecutive rounds
# instead of ~1 round in 4, scattered.
#
# Resume-safe: the sweep position is one integer, checkpointed with the rest of the
# Phase-2 resume state, so a restart continues mid-block.
# Deterministic DEFENSE-ALGORITHM sweep, for defense.mode: algorithmic only.
#
# Instead of drawing the round's algorithm uniformly, hold one algorithm for a whole
# block of consecutive rounds and sweep the pool in order. That matters because DeFL
# and DnC are stateful: under a random rotation an algorithm's memory advanced on ~1
# round in 4, scattered; here it advances over 10 consecutive rounds, much closer to
# how it behaves deployed alone.
#
# INACTIVE under defense.mode: llm (the default) — there is no algorithm axis, and the
# attack strength is the label-flip ladder's, not a schedule's. Logged at startup.
#
# Resume-safe: the sweep position is one integer, checkpointed with the rest of the
# Phase-2 resume state, so a restart continues mid-block.
curriculum:
  enabled: true                   # false = go back to the random per-round algorithm draw
  rounds_per_block: 10            # consecutive rounds per algorithm
  algorithms: null                # null = defense.algorithms, in listed order. Set a
                                  # list to narrow or reorder the sweep; every name must
                                  # be one defense.algorithms builds.

# Inference-only LLM defaults (used by --dry-run and the OpenAI path).
llm:
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:3b"

# Reinforcement learning (GRPO) settings — see README "LLM handling".
rl:
  model: "unsloth/Qwen2.5-3B-Instruct"  # HF/Unsloth base for QLoRA training
  attn_implementation: "eager"    # broadly compatible; Qwen2.5 also supports "sdpa"
  use_fast_generate: true         # KV-cached generation (fast); auto-falls back to no-cache on failure
  max_seq_len: 16384              # well within Qwen2.5-3B's 32k native context. The defender's
                                  # prompt carries per-layer feature vectors for EVERY client, so
                                  # it scales with fl.n_clients; at 20 clients it sits around 3k
                                  # tokens. This is a CAP, not an allocation — attention memory
                                  # scales with the tokens actually used, so headroom is nearly
                                  # free.
  load_in_4bit: false             # bf16 LoRA: 3B needs ~12GB+ VRAM; set true (4-bit QLoRA) if tight
  lora_r: 16
  lora_alpha: 32
  G: 4                            # rollouts per GRPO step (group size)
  kl_beta: 0.02                   # KL penalty toward the frozen base model
  lr: 1.0e-5
  temperature: 1.0                # defender sampling temperature (exploration). The G rollouts
                                  # all classify the SAME cohort of updates, so this is the only
                                  # source of within-group reward spread — at 0 every rollout is
                                  # identical, the advantages collapse and no step is ever taken.
  max_new_tokens: 1536            # headroom for the defender's 20-client verdict list (raise if
                                  # outputs get truncated — a verdict cut mid-JSON parses as
                                  # nothing, and every client then defaults to benign).
  grad_clip: 1.0
  save_every: 25                  # checkpoint adapters + progress every N rounds (resume granularity)
  league_snapshot_every: 100      # snapshot the defender adapter into the league every N rounds
  league_max_snapshots: 10        # HARD CAP on retained snapshots (ring buffer — oldest evicted).
                                  # Each is a full copy of the adapter's LoRA tensors: ~115 MB for
                                  # Qwen2.5-3B at lora_r=16, so the league costs about
                                  # league_max_snapshots x 115 MB of host RAM (~1.2 GB at 10).
                                  # Unbounded, it OOMs a long run.

  # --- Zero-advantage guard (stops the defender un-learning toward base) ---
  resample_on_zero_advantage: true # if a group has no reward spread, re-roll once at higher temp
  resample_temperature: 1.3       # temperature for that re-roll
  skip_zero_advantage: true       # if still degenerate, skip the step (apply NO gradient)
  min_reward_spread: 0.02         # NOISE FLOOR: a group whose rewards span less than this is
                                  # DEGENERATE (resample, then skip). Accuracy is measured on 10k
                                  # test examples -> quantized to 1e-4, which at the smallest
                                  # sampled target (0.05) is ~2e-3 of reward per single flipped
                                  # example. The old test was std < 1e-6, so identical rollouts
                                  # that differed by measurement noise were z-scored up to
                                  # A = +-1.2 and trained on. A real 1% accuracy gap scores 0.2
                                  # at that target, so this bar is easy for genuine differences.
  commit_selection: "sample"      # which of the G scored rollouts ADVANCES the environment.
                                  # sample = a uniform draw from the group (on-policy).
                                  # argmax = the best-scoring one (legacy). argmax made the
                                  # committed round a best-of-G result, so every logged
                                  # `learner_success` and every phase switch measured
                                  # max-of-G rather than the policy — numbers that do not
                                  # reproduce at eval, where the benchmark samples once. It
                                  # also fed the learner an optimistic state trajectory it
                                  # never has to survive. The argmax is still logged as
                                  # `best_index` next to `committed_index`.
  advantage_std_floor: 0.05       # floor on the z-score denominator, in reward units. Plain
                                  # z-scoring is scale-free (spread 0.02 and spread 1.0 both give
                                  # A = +-1.2), so the update size carried no information about how
                                  # much better the winning rollout was. Above this std it reduces
                                  # to standard GRPO. Set both to 0 for textbook GRPO.

  # --- Schedule: defender phases ---
  # A phase runs until the defender sustains a win, then its adapter is frozen and a
  # fresh phase starts. The opponent is not static: the label-flip ladder backs the
  # attack off every time the defender catches it, so winning a phase means the
  # defender has driven the attack down to a weaker level — and the phase boundary is
  # what checkpoints it at each rung it has actually mastered.
  min_phase_rounds: 3             # earliest a phase may end on a sustained win. Set equal to
                                  # success_streak so a phase ends as soon as the defender wins
                                  # success_streak times IN A ROW (no extra minimum-length gate).
  max_phase_rounds: 200           # hard cap: end the phase even without a win, so a defender
                                  # stuck on an attack level it cannot handle does not sit in
                                  # one phase forever (which would also mean the between-phase
                                  # FL interlude never fires).
  success_streak: 3               # consecutive winning rounds needed to freeze the adapter
  defender_min_tpr: 0.99          # defender "win": catches every poisoned client...
  defender_max_fpr: 0.10          # ...without over-flagging honest clients
  fl_interlude_between_phases: true # before every phase AFTER the first, run ONE honest FL round
                                  # (like Phase 1): all clients retrain from the current global
                                  # with real labels and FedAvg into a new global, and the
                                  # refreshed per-client weights become what the attack and the
                                  # aggregator consume next.
                                  # NO EFFECT while fl.freeze_global_in_phase2 is true — advancing
                                  # the shared global is exactly what a simulated round must not
                                  # do, so env.run_benign_fl_round() skips and logs instead.

  # --- The DAMAGE BAR (reporting only; nothing trains on it) ---
  # Defines the recorded `attack_damaging` / `attack_success` metric: did this round's
  # flipped labels actually cost the model something? A run where the defender wins
  # every round but the attack was never damaging is a defender that learned to detect
  # a formality.
  win_fraction: 0.6               # a round counts as damaging when the measured drop is at
                                  # least win_fraction x the round's requested
                                  # attack.goal.target_accuracy_drop. RELATIVE, so it stays
                                  # correct if the target is ever re-drawn per round. At target
                                  # 0.10 the bar is a 0.06 drop.
  attacker_min_drop: 0.10         # FALLBACK absolute bar, used only when the round's goal is
                                  # unknown. Tracks attack.goal.target_accuracy_drop so the
                                  # fallback and the relative bar ask for the same thing.

  adapter_paths:
    defender: "checkpoints/defender_adapter"
  reward:
    defender:
      mode: "soft_f1"             # soft_f1 | tpr_minus_fpr
                                  # soft_f1 weights every client by the defender's own stated
                                  # confidence, so the reward moves continuously as the verdicts
                                  # shift — which is what gives GRPO a gradient when several
                                  # rollouts happen to agree on the hard flags. tpr_minus_fpr
                                  # uses the hard flags only and is much coarser.
      fpr_penalty: 1.0            # tpr_minus_fpr only: how hard a false positive is charged.
                                  # False positives are genuinely costly here — a flagged honest
                                  # client is dropped from the aggregate, so an over-eager
                                  # defender degrades the model it is defending.
