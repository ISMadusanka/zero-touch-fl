# Defender LLM Agent Configuration

llm:
  model: "gpt-4o-mini"            # OpenAI — inference/baseline only, NOT trainable
  temperature: 0.3
  ollama_model: "qwen2.5:1.5b"    # Ollama — inference (--dry-run)

# Confidence assumed when the model omits/garbles a client entry.
default_confidence: 0.0

# RL checkpoint — a LoRA adapter over the shared Qwen2.5 base.
adapter_path: "checkpoints/defender_adapter"
