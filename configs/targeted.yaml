# TARGETED label-poisoning experiment.
#
# Separate from configs/base.yaml (the untargeted experiment) on purpose: separate
# attack goal, separate reward shape, separate LoRA adapters, separate logs. Run it
# with `python train_targeted.py`, evaluate it with
# `python -m benchmark.run_targeted_benchmark`. See TARGETED.md.
#
# Attack goal: "misclassify label L" — drive the global model's recall on ONE class
# to ~0 while every other class keeps working.
#
# Setup: ONE insider (client 0) and ONE fixed label. L is not written down here — the
# data split is non-IID, so it is derived at runtime from client 0's own shard (its
# most-represented class) by `data/target_label.py` and printed to the log at startup.
# See `attack.target_label_from_client` and `fl.n_compromisable` below.

fl:
  training_rounds: 45             # Phase 1: honest training rounds (SHARED with the
                                  # untargeted run — same checkpoints/, same baseline)
  simulation_rounds: 2000000      # Phase 2: adversarial RL rounds
  n_clients: 20                   # total federated clients (honest majority)
  n_compromisable: 1              # SINGLE INSIDER: the attacker can ONLY access clients
                                  # [0 .. n_compromisable-1] = client 0. So client 0 is the
                                  # one and only poisoner (1/20 of the FedAvg average — see
                                  # `row_zero_factor` in the attacker's prompt: it must scale
                                  # the target row by ~-19 to zero the aggregated logit).
  poison_fraction: 0.2            # legacy fallback only; the attacker CHOOSES its clients
  poison_seed: 0                  # RNG seed: non-IID partition + per-round budget/label sampling
  benign_retrain_each_round: false # false = benign clients replay frozen Phase-1 local weights
  local_epochs: 3
  batch_size: 64
  lr: 0.002
  device: "cuda"                  # RL training needs a GPU; "cpu" only for --dry-run/--baseline

data:
  dataset: "mnist"
  n_classes: 10                   # size of the per-class evaluation breakdown
  iid: false
  noniid_bias: 0.5                # FLTrust bias probability q (iid=false only)
  data_dir: "./data/mnist_raw"

attack:
  goal:
    type: "targeted_label"        # THE difference from base.yaml
    label: 2                      # FALLBACK ONLY — used when `target_label_from_client`
                                  # below is null. Otherwise it is REPLACED at runtime by
                                  # the class client 0 actually holds most of.
    target_class_drop: 0.50       # how much of the target class's RECALL to destroy.
                                  # 0.50 = "lose half the class": a class the clean model gets
                                  # 0.86 right must fall to ~0.36. Set 0.80 to demand near-total
                                  # destruction instead. Clamped per-round to that class's clean
                                  # recall, so a class the honest model only gets 0.42 right is
                                  # asked to reach ~0 rather than an impossible 0.50.
    max_collateral: 0.05          # tolerance for damage to the OTHER classes: the mean recall
                                  # they may lose before the attack stops counting as targeted.
                                  # The reward charges collateral in units of this.

  # --- WHICH label: derived at runtime from the poisoner's own data -------------
  # The data split is non-IID (FLTrust bias-q), so WHICH classes client 0 owns is
  # decided by the partition RNG (`data.noniid_bias`, `fl.poison_seed`, `fl.n_clients`)
  # and is NOT knowable from this file. Setting this to a client id makes
  # `data/target_label.py` measure that client's label histogram right after
  # partitioning and pin the run to its MOST-REPRESENTED class, so the insider attacks
  # a class it is genuinely trained on. It overrides three fields below/above:
  #     attack.goal.label               -> the derived class
  #     attack.target_labels            -> [that class]
  #     attack.sample_target_in_training-> false
  # The derivation (full histogram + chosen label + its share) is printed to
  # logs/targeted/system.log at startup, and every round's log line carries it as
  # `TGT[<label>]`. Set to null to go back to the configured label / label sampling.
  target_label_from_client: 0     # = client 0, the only compromisable client

  # --- Label sampling: only used when `target_label_from_client` is null ---------
  sample_target_in_training: false # true = redraw `goal.label` each round from `target_labels`,
                                  # which trains a LABEL-AGNOSTIC policy (it must read the label
                                  # off the goal). false = always attack `goal.label` — required
                                  # here, because the target must stay the one class client 0
                                  # holds; a per-round redraw would ask it to attack classes its
                                  # own data has almost nothing of.
  target_labels: [0, 1, 2, 3, 4, 5]  # the classes trained on when sampling is on. Replaced by
                                  # [derived label] whenever `target_label_from_client` is set.

  # --- Client-selection budget (the attacker chooses WHICH & HOW MANY to poison) ---
  max_poison_clients: 1           # TRAINING budget cap (must be <= n_compromisable). 1 =
                                  # exactly one poisoned client per round, and with
                                  # n_compromisable=1 that client is always client 0.
  sample_budget_in_training: false # nothing to randomize at a cap of 1 (a sampled budget in
                                  # [1..1] is the constant 1); keep it off so the logs say so.
  eval_poison_clients: 1          # EVALUATION default budget (benchmark --poison-clients override)

# Non-LLM defense for `python train_targeted.py --freeze defender` (and the
# benchmark's `ensemble` entry). Same knobs and defaults as configs/base.yaml —
# see there for what each member detects and why `majority` is the default vote.
defense:
  members: [fltrust, multikrum, dnc, defl]
  vote: majority
  root_size: 100
  root_epochs: 1
  root_lr: null
  eta: 1.0
  defl_delta: 0.05
  defl_tau: 2.5
  num_byzantine: null
  multikrum_m: null
  dnc_c: 1.0
  dnc_niters: 1
  dnc_sub_dim: 10000

llm:
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:3b"

rl:
  model: "unsloth/Qwen2.5-3B-Instruct"
  attn_implementation: "eager"
  use_fast_generate: true
  max_seq_len: 8192
  load_in_4bit: false
  lora_r: 16
  lora_alpha: 32
  G: 4
  kl_beta: 0.02
  lr: 1.0e-5
  temperature: 1.0
  opponent_temperature: 0.0
  scoring_opponent_temperature: 0.7
  max_new_tokens: 1024
  grad_clip: 1.0
  save_every: 25
  league_snapshot_every: 100
  league_prob: 0.25
  league_max_snapshots: 10

  resample_on_zero_advantage: true
  resample_temperature: 1.3
  skip_zero_advantage: true

  switch_mode: "best_response"
  first_learner: "attacker"
  min_phase_rounds: 3
  max_phase_rounds: 4000
  success_streak: 3
  fl_interlude_between_phases: true
  curriculum_on_cap: true
  attacker_min_drop: 0.02         # fallback only; the relative win-gate applies
  win_fraction: 0.6               # "attack passed" = target-class recall drop >= 0.6 * the
                                  # round's effective target AND collateral within tolerance
  attacker_min_evaded: 1.0
  defender_min_tpr: 0.99
  defender_max_fpr: 0.10
  K_a: 4
  K_d: 4

  # SEPARATE adapters — the targeted policy must never overwrite the untargeted one.
  adapter_paths:
    attacker: "checkpoints/targeted/attacker_adapter"
    defender: "checkpoints/targeted/defender_adapter"
  # `--freeze defender` namespaces the run to "targeted_frozen_defender", so its
  # attacker adapter defaults to checkpoints/targeted_frozen_defender/attacker_adapter
  # and leaves the targeted arms-race adapters above alone. Override here if wanted.
  # frozen_defender_adapter_paths:
  #   attacker: "checkpoints/targeted_frozen_defender/attacker_adapter"

  reward:
    attacker:
      alpha: 1.0                  # weight on the TARGET CLASS's recall-drop term
      beta: 0.5                   # weight on evasion (stealth)
      gamma: 1.0                  # penalty for malformed / wasted clients
      delta: 0.3                  # penalty for using MORE poison clients than needed
                                  # (INERT at n_compromisable=1 / max_poison_clients=1 —
                                  # both terms need >1 poisoned client to fire)
      zeta: 0.2                   # bonus for COLLABORATIVE multi-client attacks (ditto)
      eta: 1.0                    # PENALTY for collateral damage to the other classes,
                                  # in units of attack.goal.max_collateral (capped at 3.0).
                                  # This term is what makes the attack targeted instead of
                                  # merely destructive — with eta=0 the policy just
                                  # rediscovers the untargeted whole-model attack.
    defender:
      mode: "soft_f1"
      fpr_penalty: 1.0
